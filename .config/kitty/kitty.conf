#FONTS
font_family      family='Iosevka Term' postscript_name=Iosevka-Term
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size    12

disable_ligatures no
enable_audio_bell no

shell             zsh
shell_integration disable

cursor_shape         block
remember_window_size no

window_padding_width         20
cursor_blink_interval        0
scrollbar_handle_opacity     0
scrollbar_track_opacity      0
scrollbar_track_over_opacity 0

sync_to_monitor no

#COLORS
# foreground #979eab
# background #000000
# cursor #cccccc        #Curseur
# color0 #282c34
# color1 #e06c75
# color2 #70ff0a
# color3 #e5c07b
# color4 #61afef         
# color5 #be5046
# color6 #56b6c2
# color7 #979eab
# color8 #393e48
# color9 #d19a66
# color10 #56b6c2
# color11 #e5c07b
# color12 #61afef
# color13 #be5046
# color14 #56b6c2
# color15 #abb2bf
# selection_foreground #302834
# selection_background #979eab


